#==========================================================================
# Description: Build Armbian arm64 server image (Phicomm N1 / s905d)
# Product line: bookworm + s905d + server + kernel 6.6.y (auto_kernel)
# Copyright (C) 2021 https://github.com/ophub/amlogic-s9xxx-armbian
#==========================================================================

name: Build Armbian arm64 server image

# One build at a time; cancel superseded runs (manual/schedule overlap)
concurrency:
  group: armbian-s905d-bookworm-server
  cancel-in-progress: true

on:
  schedule:
    # Weekly: rebuild only when Armbian tip or ophub 6.6.y kernel changed
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Ignore fingerprint skip (scheduled runs only)."
        required: false
        default: false
        type: boolean

env:
  TZ: Etc/UTC
  ROOTFS_SCRIPT: compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  # Fixed product line (not ophub author default 6.12/6.18)
  SET_RELEASE: bookworm
  ARMBIAN_BOARD: s905d
  ARMBIAN_KERNEL: 6.6.y
  AUTO_KERNEL: "true"
  KERNEL_REPO: ophub/kernel
  KERNEL_USAGE: stable
  ARMBIAN_FSTYPE: ext4
  ARMBIAN_EDITION: server
  BUILDER_NAME: ophub
  CONFIG_BOARD: odroidn2

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare / fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.fp.outputs.skip }}
      armbian_sha: ${{ steps.fp.outputs.armbian_sha }}
      kernel_ver: ${{ steps.fp.outputs.kernel_ver }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Resolve upstream fingerprint (Armbian tip + ophub 6.6.y)
        id: fp
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"; }

          FORCE="${IN_FORCE:-false}"

          ARMBIAN_SHA=$(api "https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF}" | jq -r .sha)
          if [[ -z "${ARMBIAN_SHA}" || "${ARMBIAN_SHA}" == "null" ]]; then
            echo "::error::Could not resolve ${ARMBIAN_REPO}@${ARMBIAN_REF}"
            exit 1
          fi

          # Latest patch in the 6.6.y LTS line from ophub kernel_stable assets
          KERNEL_VERPATCH="$(echo "${ARMBIAN_KERNEL}" | awk -F. '{print $1"."$2}')"
          KERNEL_VER="$(
            curl -fsSL "https://github.com/${KERNEL_REPO}/releases/expanded_assets/kernel_${KERNEL_USAGE}" |
              grep -oP "${KERNEL_VERPATCH}\.[0-9]+(?=\.tar\.gz)" |
              sort -urV | head -n 1
          )"
          if [[ -z "${KERNEL_VER}" ]]; then
            echo "::error::Could not resolve latest ${ARMBIAN_KERNEL} from ${KERNEL_REPO} kernel_${KERNEL_USAGE}"
            exit 1
          fi

          FINGERPRINT="armbian=${ARMBIAN_SHA} kernel=${KERNEL_VER} board=${ARMBIAN_BOARD} release=${SET_RELEASE}"

          echo "Armbian ${ARMBIAN_REPO}@${ARMBIAN_REF} → ${ARMBIAN_SHA}"
          echo "Kernel ${KERNEL_REPO} kernel_${KERNEL_USAGE} ${ARMBIAN_KERNEL} → ${KERNEL_VER}"
          echo "Fingerprint ${FINGERPRINT}"

          SKIP=false
          if [[ "${EVENT_NAME}" == "schedule" && "${FORCE}" != "true" ]]; then
            LAST_BODY=$(api "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" \
              | jq -r 'map(select(.draft==false)) | .[0].body // empty')
            if [[ -n "${LAST_BODY}" ]] && grep -Fq "Fingerprint: ${FINGERPRINT}" <<<"${LAST_BODY}"; then
              echo "Schedule skip: fingerprint matches latest release (no upstream change)"
              SKIP=true
            else
              echo "Schedule build: fingerprint differs from latest release (or no prior release)"
            fi
          fi

          {
            echo "skip=${SKIP}"
            echo "armbian_sha=${ARMBIAN_SHA}"
            echo "kernel_ver=${KERNEL_VER}"
            echo "fingerprint=${FINGERPRINT}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Prepare"
            echo "- Product: \`${SET_RELEASE}\` / \`${ARMBIAN_BOARD}\` / \`${ARMBIAN_KERNEL}\` (auto_kernel=\`${AUTO_KERNEL}\`)"
            echo "- Armbian: \`${ARMBIAN_REPO}@${ARMBIAN_REF}\` (\`${ARMBIAN_SHA}\`)"
            echo "- Kernel: \`${KERNEL_REPO}\` \`kernel_${KERNEL_USAGE}\` → \`${KERNEL_VER}\`"
            echo "- Fingerprint: \`${FINGERPRINT}\`"
            echo "- Skip: \`${SKIP}\` (event=\`${EVENT_NAME}\`)"
          } >>"${GITHUB_STEP_SUMMARY}"

  build:
    name: build-armbian-bookworm
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Owner-only for manual/dispatch; schedule always allowed. Skip when fingerprint unchanged.
    if: >
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name == 'schedule' ||
       github.event.repository.owner.id == github.event.sender.id)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian source code
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          df -hT ${PWD}
          git clone -q --single-branch --depth=1 --branch=${ARMBIAN_REF} https://github.com/${ARMBIAN_REPO}.git build
          cd build
          TIP="$(git rev-parse HEAD)"
          WANT="${{ needs.prepare.outputs.armbian_sha }}"
          if [[ "${TIP}" != "${WANT}" ]]; then
            git fetch -q --depth=1 origin "${WANT}"
            git checkout -q "${WANT}"
          fi
          echo "Checked out $(git rev-parse HEAD)"
          cd ..
          ln -sf /builder/build ${{ github.workspace }}/build
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile Armbian [ ${{ env.SET_RELEASE }} ]
        id: compile
        working-directory: /builder
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true

          cd build/
              ./compile.sh RELEASE=${SET_RELEASE} BOARD=${CONFIG_BOARD} BRANCH=current BUILD_MINIMAL=no \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Organize output files and reclaim disk space
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${SET_RELEASE} -s true -c true -k true -p arm64

          cd build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null

          df -hT ${PWD}
          echo "build_tag=Armbian_${SET_RELEASE}_arm64_${ARMBIAN_EDITION}_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload Armbian image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: build/output/images/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild Armbian for target boards
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ env.ARMBIAN_BOARD }}
          armbian_kernel: ${{ env.ARMBIAN_KERNEL }}
          auto_kernel: ${{ env.AUTO_KERNEL }}
          kernel_repo: ${{ env.KERNEL_REPO }}
          kernel_usage: ${{ env.KERNEL_USAGE }}
          armbian_fstype: ${{ env.ARMBIAN_FSTYPE }}
          builder_name: ${{ env.BUILDER_NAME }}

      - name: Upload rebuilt images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian Image Information
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            - Board: `${{ env.ARMBIAN_BOARD }}`
            - Release: `${{ env.SET_RELEASE }}`
            - Kernel line: `${{ env.ARMBIAN_KERNEL }}` (resolved `${{ needs.prepare.outputs.kernel_ver }}`, auto_kernel=`${{ env.AUTO_KERNEL }}`)
            - Armbian: `${{ env.ARMBIAN_REPO }}@${{ env.ARMBIAN_REF }}` (`${{ needs.prepare.outputs.armbian_sha }}`)
            - Fingerprint: `${{ needs.prepare.outputs.fingerprint }}`
            ### Applicable Platform
            - 🐧 `arm64`
